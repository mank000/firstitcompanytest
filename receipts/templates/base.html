{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Чек на удачу{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'receipts/style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="{% url 'receipts:list' %}">Чек на удачу</a>
            <nav class="header-nav" aria-label="Основная навигация">
                {% if user.is_authenticated %}
                    <a href="{% url 'receipts:list' %}">Личный кабинет</a>
                    <span class="username">{{ user.username }}</span>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="nav-button">Выйти</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}">Войти</a>
                    <a href="{% url 'receipts:register' %}">Регистрация</a>
                {% endif %}
            </nav>
        </div>
    </header>
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
