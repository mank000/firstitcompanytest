<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои чеки</title>
</head>
<body>
    <h1>Мои чеки</h1>

    <a href="{% url 'receipts:create' %}">
        Зарегистрировать чек
    </a>

    {% for receipt in page %}
        <div>
            <p>
                {{ receipt.purchase_at }}
                — {{ receipt.amount }} руб
                — {{ receipt.get_status_display }}
            </p>

            {% if receipt.rejection_reason %}
                <p>
                    Причина отказа:
                    {{ receipt.rejection_reason }}
                </p>
            {% endif %}
        </div>
    {% empty %}
        <p>Чеков пока нет.</p>
    {% endfor %}
</body>
</html>
