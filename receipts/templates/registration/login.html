{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<section class="auth-card">
    <h1>Вход</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button" type="submit">Войти</button>
    </form>
    <p class="auth-footer">Нет аккаунта? <a href="{% url 'receipts:register' %}">Зарегистрироваться</a></p>
</section>
{% endblock %}
